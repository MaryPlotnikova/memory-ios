<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>iOS HIG · Карточки</title>
<style>
  :root{
    --grad: linear-gradient(135deg, #FF9C6B 0%, #E15850 100%);
    --grad-plate: linear-gradient(135deg, #EF885F 0%, #EE7F60 20%, #EA6159 40%, #E66261 58%, #E2727A 78%, #DE7687 100%);
    --bg: #f2f2f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #6e6e73;
    --accent: #E15850;
    --green: #2fae54;
    --red: #e5473f;
    --radius: 20px;
    --shadow: 0 10px 24px rgba(0,0,0,0.08);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  #app{
    max-width: 460px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 18px 0 8px;
    position: sticky;
    top:0;
    background: var(--bg);
    z-index: 10;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color: var(--accent);
    font-size:18px;
    flex-shrink:0;
  }
  .topbar h1{
    font-size: 20px;
    font-weight: 700;
    margin:0;
    flex:1;
  }
  .home-btn{
    width:44px; height:44px;
    border-radius:14px;
    border:none;
    background: var(--grad);
    box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .home-btn svg{ width:20px; height:20px; }
  .empty-placeholder{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-secondary);
    font-size: 15px;
    text-align:center;
  }
  .screen{ display:none; flex-direction: column; flex:1; padding: 0 20px 32px; animation: fadeIn .25s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  .page-title{
    font-size: 34px;
    font-weight: 800;
    margin: 6px 0 18px;
    letter-spacing: -0.02em;
  }
  .group-section{ margin-bottom: 8px; }
  .group-section:not(:first-child){ margin-top: 30px; }
  .group-title{
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .group-subtitle{
    font-size: 13.5px;
    color: var(--text-secondary);
    margin: 0 0 14px;
  }

  .continue-banner{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    cursor:pointer;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .continue-banner .dot{
    width:10px;height:10px;border-radius:50%;
    background: var(--accent); flex-shrink:0;
  }
  .continue-banner .txt{ flex:1; }
  .continue-banner .txt strong{ display:block; font-size:15px; }
  .continue-banner .txt span{ font-size:13px; color: var(--text-secondary); }
  .continue-banner .arrow{ color: var(--text-secondary); font-size:18px; }

  .cat-list{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .cat-row{
    display:flex; align-items:center; gap: 13px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .cat-row .icon-box{
    width:48px; height:48px; border-radius: 12px;
    background: var(--grad);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .cat-row .icon-box svg{ width:32px; height:32px; }
  .cat-row .label{ flex:1; min-width:0; }
  .cat-row .label strong{ display:block; font-size:15px; font-weight:700; }
  .cat-row .label span{
    display:block; font-size:12px; color: var(--text-secondary); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cat-row .count{ font-size:11.5px; color: var(--text-secondary); font-weight:600; flex-shrink:0; }
  .cat-row .chev{ color: var(--text-secondary); font-size:18px; flex-shrink:0; }

  .quiz-all-row{
    display:flex; align-items:center; gap: 14px;
    background: var(--grad-plate);
    border-radius: 16px;
    padding: 15px;
    box-shadow: var(--shadow);
    border: none;
    cursor: pointer;
    text-align: left;
    color: #fff;
    width: 100%;
    margin-bottom: 26px;
    position: relative;
  }
  .quiz-all-row .icon-box{
    width:48px; height:48px; border-radius: 12px;
    background: rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    flex-shrink:0;
  }
  .quiz-all-row .label{ flex:1; min-width:0; }
  .quiz-all-row .label strong{ display:block; font-size:16px; font-weight:800; }
  .quiz-all-row .label span{ display:block; font-size:12.5px; opacity:.9; margin-top:2px; }
  .quiz-all-row .chev{ font-size:18px; opacity:.9; flex-shrink:0; }

  .quiz-all-row.is-disabled{
    cursor: default;
    filter: grayscale(0.55);
    opacity: 0.68;
  }
  .quiz-all-row .lock-badge{
    position: absolute;
    top: 10px;
    right: 12px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.32);
    display:flex; align-items:center; justify-content:center;
  }

  .subgrid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .subgrid-item{
    border-radius: 18px;
    background: var(--grad);
    padding: 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    border: none;
    text-align: left;
    color: white;
    position: relative;
    overflow: hidden;
    min-height: 140px;
    display:flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .subgrid-item .icon-row{ display:flex; gap:4px; margin-bottom: 10px; opacity:.95; }
  .subgrid-item .icon-row svg{ width:26px; height:26px; }
  .subgrid-item h3{ margin:0 0 4px; font-size: 16px; font-weight: 800; line-height:1.15; }
  .subgrid-item p{ margin:0; font-size:11.5px; opacity:.92; line-height:1.3; }
  .subgrid-item .count-pill{
    position:absolute; top:10px; right:10px;
    background: rgba(255,255,255,0.25);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
  }

  .mode-select{
    display:flex; flex-direction: column; gap: 14px; margin-top: 8px;
  }
  .comp-preview{
    border-radius: var(--radius);
    background: var(--grad);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 22px;
    display:flex; align-items:center; justify-content:center;
    height: 150px;
  }
  .comp-preview svg{ width:100%; height:100%; }
  .comp-preview.has-image{ padding:0; background:none; overflow:hidden; }
  .comp-preview.has-image img{ display:block; width:100%; height:100%; object-fit:cover; }

  .mode-btn{
    display:flex; align-items:center; gap: 14px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    border: none;
    cursor: pointer;
    text-align: left;
  }
  .mode-btn .emoji-box{
    width:46px; height:46px; border-radius: 12px;
    background: var(--grad);
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    flex-shrink:0;
  }
  .mode-btn .label{ flex:1; }
  .mode-btn .label strong{ display:block; font-size:16px; }
  .mode-btn .label span{ font-size:13px; color: var(--text-secondary); }
  .mode-btn .chev{ color: var(--text-secondary); font-size:18px; }

  .progress-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin: 4px 0 18px;
  }
  .progress-dot{
    width:7px; height:7px; border-radius:50%;
    background: #d4d4d9;
    transition: background .2s, transform .2s;
  }
  .progress-dot.done{ background: var(--accent); }
  .progress-dot.current{ background: var(--accent); transform: scale(1.4); }

  .counter{
    text-align:center;
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 14px;
  }

  .flash-card{
    background: var(--grad);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 26px;
    display:flex;
    flex-direction: column;
    align-items:center;
    min-height: 230px;
    justify-content: center;
  }
  .flash-card svg{ width:100%; max-width: 320px; height: auto; }
  .flash-card.has-image{ padding:0; background: none; box-shadow: var(--shadow); border-radius:24px; overflow:hidden; }
  .flash-card.has-image img{ display:block; width:calc(100% + 2px); max-width:none; height:auto; margin:-1px; }
  .flash-card-wrap{ position:relative; }
  .examples-link{
    position:absolute;
    right:16px; bottom:14px;
    display:flex; align-items:center; gap:2px;
    background: rgba(255,255,255,0.22);
    color:#fff;
    font-size:13px; font-weight:700;
    padding:6px 10px 6px 12px;
    border-radius:999px;
    border:none;
    cursor:pointer;
  }

  /* ---------- INFO SCREEN ---------- */
  .info-caption{ font-size:18px; font-weight:600; color: var(--text); margin: 20px 0 12px; }
  .info-caption:first-child{ margin-top:4px; }
  .info-subheading{ font-size:15px; font-weight:600; color: var(--text); margin: 18px 0 6px; }
  .info-paragraph{ font-size:15px; line-height:1.5; color: var(--text-secondary); margin: 0 0 8px; white-space: pre-line; }
  .phone-mock{
    width:100%; max-width: 280px;
    margin: 18px auto 8px;
    background:#000;
    border-radius: 40px;
    padding: 10px;
    box-shadow: var(--shadow);
  }
  .phone-mock .mock-screen{
    background: var(--bg);
    border-radius: 30px;
    overflow: hidden;
    display:flex; flex-direction:column;
    min-height: 360px;
    position: relative;
  }
  .phone-mock .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px 4px;
    font-size:12px; font-weight:700; color:var(--text);
  }
  .phone-mock .status-bar .dots{ display:flex; gap:3px; align-items:center; }
  .phone-mock .status-bar .dots span{ width:3px; height:3px; border-radius:50%; background:var(--text); display:inline-block; }
  .ex-body{ flex:1; position:relative; padding: 8px 14px 0; }

  /* Action sheet example */
  .ex-mail-header{ display:flex; justify-content:space-between; align-items:center; padding:6px 2px 10px; }
  .ex-mail-header .x{ width:26px; height:26px; border-radius:50%; background:#e2e2e7; }
  .ex-mail-header .send{ width:26px; height:26px; border-radius:50%; background: var(--accent); }
  .ex-mail-title{ font-size:14px; font-weight:700; background:#e9e9ee; display:inline-block; padding:5px 10px; border-radius:8px; margin-bottom:8px; }
  .ex-mail-row{ height:11px; background:#e9e9ee; border-radius:4px; margin-bottom:8px; width:85%; }
  .ex-sheet-pop{
    position:absolute; left:10px; right:10px; bottom:10px;
    background:#fff; border-radius:16px;
    box-shadow: 0 -6px 18px rgba(0,0,0,0.12);
    overflow:hidden;
  }
  .ex-sheet-pop .opt{ padding:13px; text-align:center; font-size:13.5px; font-weight:600; border-bottom:1px solid #ececf1; }
  .ex-sheet-pop .opt.destructive{ color:var(--red); }

  /* Alert example */
  .ex-alert-dim{ position:absolute; inset:0; background:rgba(0,0,0,0.25); }
  .ex-alert-box{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width: 200px; background:#f7f7fa; border-radius:14px; overflow:hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .ex-alert-box .at{ font-size:13px; font-weight:700; text-align:center; padding:14px 12px 4px; }
  .ex-alert-box .am{ font-size:11px; color:var(--text-secondary); text-align:center; padding:0 12px 12px; }
  .ex-alert-box .ab{ display:flex; border-top:1px solid #d9d9de; }
  .ex-alert-box .ab div{ flex:1; text-align:center; padding:10px 0; font-size:12.5px; font-weight:600; color:var(--accent); }
  .ex-alert-box .ab div:first-child{ border-right:1px solid #d9d9de; color:var(--text); }

  /* Page control example */
  .ex-hero{ margin-top:6px; height:220px; border-radius:18px; background: var(--grad); }
  .ex-dots{ display:flex; justify-content:center; gap:6px; margin-top:14px; }
  .ex-dots span{ width:6px; height:6px; border-radius:50%; background:#c7c7cc; }
  .ex-dots span.on{ background: var(--accent); }

  /* Sheet example */
  .ex-sheet-tall{
    position:absolute; left:0; right:0; bottom:0; top:35%;
    background:#fff; border-radius:18px 18px 0 0;
    box-shadow: 0 -6px 18px rgba(0,0,0,0.12);
    padding-top:8px;
  }
  .ex-sheet-tall .grabber{ width:36px; height:4px; border-radius:2px; background:#d9d9de; margin:0 auto 14px; }
  .ex-sheet-tall .row{ height:10px; background:#ececf1; border-radius:4px; margin:0 16px 10px; }
  .ex-sheet-tall .row.short{ width:40%; }

  .info-image{ margin: 0 0 20px; }
  .info-image img{
    display:block;
    width:100%;
    max-width: 300px;
    max-height: 420px;
    height:auto;
    object-fit: contain;
    margin: 0 auto;
  }
  .info-image.small img{ max-width: 130px; }
  .info-image.xsmall img{ max-width: 95px; }
  .info-image.full img{ max-width: 100%; }
  .info-image-cap{
    text-align:center;
    font-size:12.5px;
    color: var(--text-secondary);
    margin-top:8px;
  }

  .picker{ margin: 4px 0 20px; }
  .picker-panel{ display:none; }
  .picker-panel.active{ display:block; }
  .picker-panel .info-image{ margin: 0 0 16px; }
  .wheel-picker{
    position:relative;
    height:170px;
    border-radius:14px;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    overflow:hidden;
  }
  .wheel-track{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type: y mandatory;
    padding: 68px 0;
    scrollbar-width:none;
  }
  .wheel-track::-webkit-scrollbar{ display:none; }
  .wheel-item{
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:center;
    font-size:15px;
    color: var(--text-secondary);
    cursor:pointer;
    white-space:nowrap;
    padding:0 12px;
    text-align:center;
    background:none;
    border:none;
    width:100%;
    transition: color .1s;
  }
  .wheel-item.center{
    color: var(--text);
    font-weight:700;
  }
  .wheel-highlight{
    position:absolute;
    left:0; right:0; top:50%;
    height:34px;
    margin-top:-17px;
    border-top:1px solid #d1d1d6;
    border-bottom:1px solid #d1d1d6;
    pointer-events:none;
  }
  .wheel-fade-top, .wheel-fade-bottom{
    position:absolute; left:0; right:0; height:56px; pointer-events:none;
  }
  .wheel-fade-top{ top:0; background: linear-gradient(var(--card-bg), rgba(255,255,255,0)); }
  .wheel-fade-bottom{ bottom:0; background: linear-gradient(rgba(255,255,255,0), var(--card-bg)); }

  .card-info{
    text-align:center;
    margin-top: 18px;
  }
  .cat-badge{
    position:absolute;
    top:14px; left:16px;
    display:inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.22);
    padding: 4px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .cat-badge:empty{ display:none; }
  .name-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .card-info .eng-name{
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
  }
  .card-info .ru-desc{
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.45;
  }
  .nav-row{
    display:flex; align-items:center; gap: 12px;
    margin-top: auto;
    padding-top: 22px;
  }
  .nav-btn{
    flex:1;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .nav-btn.secondary{
    background: var(--card-bg);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .nav-btn.primary{
    background: var(--accent);
    color: white;
  }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .nav-arrow{
    flex: 0 0 84px;
    width: 84px;
    height: 52px;
    padding: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 22px;
    line-height: 1;
    background: var(--card-bg);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .nav-arrow.primary{
    background: var(--accent);
    color: #fff;
    box-shadow: none;
  }
  .nav-examples{
    flex:1;
    font-weight: 700;
    background: var(--card-bg);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .nav-examples:disabled{
    font-weight: 400;
  }

  .quiz-description{
    font-size: 14.5px;
    color: var(--text-secondary);
    line-height: 1.45;
    text-align: center;
    margin: 14px 2px 0;
  }
  .quiz-input-wrap{ margin-top: 22px; }
  .quiz-input{
    width:100%;
    padding: 16px 18px;
    font-size: 18px;
    border-radius: 14px;
    border: 1px solid #e2e2e7;
    background: var(--card-bg);
    outline: none;
    text-align:center;
    font-weight: 400;
    color: var(--text);
    transition: border-color .15s, color .15s;
  }
  .quiz-input:focus{ border-color: var(--accent); }
  .quiz-input.correct{ border-color: var(--green); color: var(--green); background: #eafaf0; }
  .quiz-input.incorrect{ border-color: var(--red); color: var(--red); background: #fdeeed; }
  .quiz-hint{
    text-align:center;
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 10px;
    min-height: 18px;
  }
  .quiz-hint.reveal{ color: var(--red); font-weight: 600; }
  .quiz-hint.typo{ color: var(--green); font-weight: 600; }

  .result-wrap{
    display:flex; flex-direction: column; align-items:center; justify-content:center;
    flex:1; text-align:center; gap:10px;
  }
  .result-score{
    font-size: 56px;
    font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .result-wrap p{ color: var(--text-secondary); font-size:15px; max-width: 280px; }
  .result-actions{ display:flex; gap:12px; width:100%; margin-top: 18px; }

  ::selection{ background: rgba(225,88,80,0.2); }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="topbar" style="visibility:hidden;"><button class="back-btn">‹</button></div>
    <div style="padding: 0 0 8px;">
      <div id="continueBanner"></div>
      <div id="homeGroups"></div>
    </div>
  </div>

  <!-- DESIGN SYSTEM SECTION (placeholder, empty for now) -->
  <div class="screen" id="screen-design-system">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">‹</button>
      <h1>Дизайн-система iOS</h1>
    </div>
    <div class="empty-placeholder">
      <p>Раздел скоро появится</p>
    </div>
  </div>

  <!-- CATEGORY (mode select) -->
  <div class="screen" id="screen-category">
    <div class="topbar">

/* ---------- STATE ---------- */
const PROGRESS_KEY = 'hig_flashcards_progress_v1';
let state = {
  categoryId: null,
  mode: null,       // 'study' | 'quiz'
  index: 0,
  quizResults: []   // array of true/false/null aligned with components
};

function saveProgress(){
  if(!state.categoryId || !state.mode) { localStorage.removeItem(PROGRESS_KEY); return; }
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearProgress(){
  localStorage.removeItem(PROGRESS_KEY);
}

function getCategory(id){
  if(id === '__global__'){
    const all = {};
    DATA.forEach(cat => cat.components.forEach(c => { all[c.id] = c; }));
    return {
      id: '__global__',
      title: 'Общая викторина',
      subtitle: 'Случайные карточки из всех разделов',
      components: (state.globalIds || []).map(cid => all[cid]).filter(Boolean)
    };
  }
  if(id === '__global_study__'){
    return {
      id: '__global_study__',
      title: 'Все компоненты',
      subtitle: 'Изучение всех разделов подряд',
      components: DATA.filter(cat => (cat.group || 'components') === 'components')
        .flatMap(cat => cat.components)
    };
  }
  const cat = DATA.find(c => c.id === id);
  // In quiz mode, show this category's cards in the shuffled order set up by startQuiz(),
  // instead of the fixed order used for Study mode.
  if(cat && state.mode === 'quiz' && state.categoryId === id && state.quizIds && state.quizIds.length){
    const byId = {};
    cat.components.forEach(c => { byId[c.id] = c; });
    return Object.assign({}, cat, { components: state.quizIds.map(cid => byId[cid]).filter(Boolean) });
  }
  return cat;
}

function shuffledIds(components){
  const ids = components.map(c => c.id);
  for(let i = ids.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  return ids;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function goHome(){
  state.mode = null;
  renderHome();
  showScreen('screen-home');
}

let currentCategoryForModeScreen = null;
// Both Study and Quiz now run across everything (no more per-section
// screens to return to), so stepping "back" from either always lands on
// the mode-select screen for '__global_study__'/'__global__', or Home.
function goCategory(){
  state.mode = null;
  saveProgress();
  if(currentCategoryForModeScreen === '__global_study__'){
    openHigModeSelect();
  } else {
    goHome();
  }
}

    showScreen('screen-study');
  } else if(state.mode === 'quiz'){
    renderQuizCard();
    showScreen('screen-quiz');
  }
}

/* ---------- MODE SELECT (Готовые элементы iOS -> Изучение/Викторина) ---------- */
// Sections used to gate this screen (pick a category, then pick a mode), but
// most sections only held 1-2 components, so splitting them up added a step
// for no real benefit. Study and Quiz both work across everything now (see
// startStudy() and startGlobalQuiz()); this screen just offers the choice.
function openHigModeSelect(){
  currentCategoryForModeScreen = '__global_study__';
  document.getElementById('catTitle').textContent = 'Готовые элементы iOS';
  const catPreviewEl = document.getElementById('catPreview');
  catPreviewEl.classList.add('has-image');
  catPreviewEl.innerHTML = '<img src="assets/hig-hero.png" alt="Готовые элементы iOS">';
  showScreen('screen-category');
}

/* ---------- STUDY MODE ---------- */
// Study is always global: it runs through every component from every
// category as one continuous deck, with the originating section shown
// as a small badge on the card (see COMPONENT_CATEGORY / .cat-badge).
function startStudy(){
  const tappedCatId = currentCategoryForModeScreen;
  currentCategoryForModeScreen = '__global_study__';
  state.categoryId = '__global_study__';
  state.mode = 'study';
  const all = getCategory('__global_study__').components;
  const startIdx = all.findIndex(c => COMPONENT_CATEGORY[c.id] && COMPONENT_CATEGORY[c.id].id === tappedCatId);
  state.index = startIdx >= 0 ? startIdx : 0;
  saveProgress();
  renderStudyCard();
  showScreen('screen-study');
}

    { type:'heading', text:'Анатомия' },
    { type:'image', src:'assets/tab-bars-anatomy.png', alt:'Иконка и подпись вкладки' },
    { type:'text', text:'У каждой вкладки есть иконка и короткая подпись. Иконки лучше делать на основе SF Symbols — они хорошо масштабируются и одинаково чётко выглядят при любом размере таб-бара.\n\nSF Symbols — библиотека иконок от Apple, сейчас больше 7000 штук, специально спроектированная под системный шрифт San Francisco. Такие значки можно вставлять как иконки в тулбарах, таб-барах, меню и прямо в тексте — они сами подстраиваются под насыщенность и размер соседнего шрифта.' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Используйте таб-бар для навигации между разделами приложения, а не для действий над текущим экраном — для этого нужен тулбар.\n\nДержите таб-бар видимым во всех разделах приложения; скрывайте его только под модальным экраном.\n\nИспользуйте столько вкладок, сколько нужно для навигации, но обычно не больше пяти — лишние уходят в раздел «Ещё», куда сложнее заглянуть.\n\nНе отключайте и не скрывайте кнопки вкладок, даже если раздел временно пуст, — объясните пустоту внутри самого раздела.\n\nДавайте каждой вкладке короткое, понятное название.' },
    { type:'heading', text:'Кнопка поиска' },
    { type:'text', text:'Если в приложении есть отдельный раздел поиска, его можно вынести отдельной круглой кнопкой рядом с таб-баром — так поиск всегда остаётся под рукой.' },
    { type:'heading', text:'Прикреплённый аксессуар' },
    { type:'text', text:'Над таб-баром можно закрепить аксессуар — например, мини-плеер, как в приложении Музыка. Он остаётся на экране при переключении между вкладками. Когда таб-бар сворачивается при прокрутке контента, аксессуар сжимается и встаёт в один ряд с вкладками.' },
    { type:'image', src:'assets/tab-bars-accessory-expanded.png', alt:'Аксессуар в развёрнутом виде над таб-баром', caption:'Развёрнутый аксессуар — мини-плеер над таб-баром' },
    { type:'image', src:'assets/tab-bars-accessory-minimized.png', alt:'Аксессуар в свёрнутом виде рядом с таб-баром', caption:'При сворачивании таб-бара аксессуар встраивается в одну строку с ним' }

  'status-bars': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },

    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Не заменяйте системную строку состояния собственной — люди ожидают, что она выглядит одинаково во всех приложениях. Стиль текста и значков (светлый или тёмный) можно задать глобально для приложения или отдельно для каждого экрана: тёмный вариант хорошо читается на светлом фоне, светлый — на тёмном. Не размещайте под строкой состояния интерактивный контент — это создаёт впечатление, что по ней можно нажать. Скрывайте её только временно, например при просмотре фото на весь экран, и дайте человеку простой способ вернуть её обратно — например, одним касанием.' },

    { type:'image', src:'assets/status-bars-visible.png', alt:'То же фото в приложении Фото с показанной строкой состояния и панелью навигации', caption:'Одно касание возвращает строку состояния вместе с панелью навигации' }

    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Настраивайте вид слайдера, если это добавляет пользы: цвет трека, изображение бегунка, иконки по краям — так интерфейс лучше сообщает смысл значения. Например, слайдер размера изображения можно обозначить маленькой и крупной иконкой по краям.\n\nНе используйте обычный слайдер для регулировки громкости звука — для этого в системе есть специальный элемент управления громкостью.' }

  'segmented-controls': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/segmented-controls-figma.png', alt:'Компонент Segmented Control из Figma — активное и задизейбленное состояния', caption:'Segmented Control' },
    { type:'image', src:'assets/segmented-controls-light.png', alt:'Варианты segmented control с разным числом сегментов в светлой теме', caption:'Число сегментов и ширину подписей можно адаптировать под контент' },
    { type:'image', src:'assets/segmented-controls-dark.png', alt:'Те же варианты в тёмной теме', caption:'Светлая и тёмная версии одного и того же компонента' },
    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Segmented control показывает тесно связанные между собой варианты, которые влияют на объект, состояние или экран — например, переключают режим просмотра. Не используйте его для действий вроде добавления, удаления или редактирования контента — для этого есть кнопки.\n\nВыбор может быть одиночным (например, выравнивание текста) или множественным, когда можно включить сразу несколько сегментов (например, одновременно жирный и курсивный стиль).\n\nВ одном контроле используйте либо текст, либо изображения — не смешивайте их, и делайте подписи сегментов примерно одинаковой длины. На iPhone ограничивайте число сегментов примерно пятью, иначе контролом становится неудобно пользоваться.\n\nНе размещайте segmented control в тулбаре: тулбар предназначен для действий, а не для переключения контекста.' },
    { type:'image', src:'assets/segmented-controls-health.png', alt:'Segmented control с выбором периода в приложении Активность', caption:'В приложении «Активность» segmented control предлагает выбор периода времени для отображения графиков активности' },
    { type:'image', src:'assets/segmented-controls-calendar.png', alt:'Segmented control «Event / Reminder» в Календаре', caption:'В Календаре segmented control переключает между созданием события и напоминания, меняя тип создаваемого объекта' }
  ]},
  'progress-indicators': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/progress-indicators-figma-light.png', alt:'Линейный индикатор прогресса и спиннер в светлой теме', caption:'Light examples' },
    { type:'image', src:'assets/progress-indicators-figma-dark.png', alt:'Те же индикаторы в тёмной теме', caption:'Светлая и тёмная версии индикаторов — линейного с прогрессом и спиннера' },
    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Progress indicator показывает, что приложение работает, пока грузится контент или идёт долгая операция, — и сколько ещё ждать.\n\nДва типа: determinate — заполняется слева направо (линейный) или по часовой стрелке (круглый) и показывает долю выполненного, когда время операции известно. Indeterminate (спиннер) — просто анимируется, без информации о времени.\n\nГде можно — используйте determinate: так понятнее, сколько осталось. Прогресс должен отражать реальный ход операции, без рывков. Пока процесс идёт — индикатор анимирован, иначе выглядит как зависание. Не переключайте вид индикатора внутри одной операции.\n\nПодписывайте понятно — не «Loading», а суть операции. По возможности давайте отменить операцию. В тулбаре скрывайте незаполненную часть индикатора.\n\nСпиннер хорош для фона и тесных мест. Pull-to-refresh — свайп вниз для мгновенной перезагрузки контента.' },
    { type:'image', src:'assets/progress-indicators-determinate-bar.png', alt:'Линейный индикатор с прогрессом (determinate)', size:'small', caption:'Линейный вид индикатора с прогрессом' },
    { type:'image', src:'assets/progress-indicators-determinate-circle.png', alt:'Круглый индикатор с прогрессом (determinate)', size:'small', caption:'Круглый вид индикатора с прогрессом — заполняется по часовой стрелке' }
  ]},
  'pop-up-buttons': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/pop-up-buttons-figma.png', alt:'Компонент Pop-up Button из Figma — активное и задизейбленное состояния', caption:'Popup Button' },
    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Используйте pop-up button, когда нужно выбрать один вариант из списка, например периодичность повтора события. Если вместо выбора значения нужен список действий, возможность отметить сразу несколько пунктов или подменю — это задача для Pull-Down Button, а не для pop-up button.\n\nДобавляйте рядом с кнопкой короткую подпись, поясняющую, что именно выбирают (например, «Повтор»), а название самой кнопки пусть отражает текущее значение («Никогда», «Каждую неделю» и т.д.). Показывайте небольшой значок с двумя шевронами — так понятно, что элемент можно раскрыть.' },
    { type:'image', src:'assets/pop-up-buttons-closed.png', alt:'Pop-up button «Repeat» со значением Never в приложении Календарь', caption:'В Календаре pop-up button «Repeat» показывает текущее значение — Never' },
    { type:'image', src:'assets/pop-up-buttons-open.png', alt:'Открытое меню pop-up button с вариантами повтора', caption:'После нажатия открывается меню вариантов; текущий выбор отмечен галочкой' }
  ]},
  'notifications': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/notifications-figma-collapsed.png', alt:'Несколько свёрнутых уведомлений друг за другом', caption:'Notification - Collapsed' },
    { type:'image', src:'assets/notifications-figma-collapsed-list.png', alt:'Уведомления в развёрнутом списке одно под другим', caption:'Notification - Collapsed - List' },
    { type:'image', src:'assets/notifications-figma-content.png', alt:'Анатомия уведомления: заголовок, описание и область дополнительного контента', caption:'Content Background' },
    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Способ и время показа уведомлений человек настраивает сам.\n\nДержите уведомления короткими и полезными — бесполезные или навязчивые просто отключат. Не дублируйте одно событие несколькими уведомлениями, не используйте их как инструкцию по приложению и не размещайте конфиденциальные данные.\n\nЗаголовок — с большой буквы у каждого слова, текст — полными предложениями. Если содержимое может быть скрыто (например, на заблокированном экране), заранее придумайте понятную заглушку.\n\nМожно добавить до четырёх кнопок быстрых действий — вместо открытия приложения. Разрушающее действие («Удалить») давайте только с понятным контекстом.\n\nБейдж — число на иконке — только для непрочитанных уведомлений, не для другой цифры вроде погоды или счёта.' },
    { type:'image', src:'assets/notifications-lockscreen.png', alt:'Уведомление на заблокированном экране iPhone', caption:'На заблокированном экране уведомление показывает иконку, заголовок, текст и время' },
    { type:'image', src:'assets/notifications-banner.png', alt:'Баннер уведомления поверх главного экрана iPhone', caption:'Во время использования устройства уведомление ненадолго появляется баннером сверху экрана' }
  ]},

  'activity-views': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/activity-views-dark-figma.png', alt:'Activity View на iPhone, тёмная тема: превью объекта сверху, быстрый доступ к контактам и приложениям, ниже — список действий', caption:'Dark examples' },

    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Открывается по нажатию кнопки Share, поверх текущего экрана.\n\nНе дублируйте действия, которые система уже предлагает, — иначе человеку будет непонятно, чем ваше действие отличается от системного. Для своих действий используйте символ SF Symbols (библиотека иконок от Apple, сейчас больше 7000 штук, специально спроектированная под системный шрифт San Francisco) и короткий заголовок-глагол, а не название компании.\n\nПоказывайте только действия, применимые к текущему контенту, — то, что не подходит, лучше исключить, чтобы не перегружать список.' },

  'buttons': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/buttons-dark-figma.png', alt:'Кнопки на тёмном фоне: заполненная и серая (тонированная), с текстом и в виде иконки, обычная и деструктивная', caption:'Dark examples' },
    { type:'image', src:'assets/buttons-light-figma.png', alt:'Кнопки на светлом фоне: заполненная и серая (тонированная), с текстом и в виде иконки, обычная и деструктивная', caption:'Light examples' },
    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Её функцию доносят три составляющих: стиль (размер, цвет и форма), содержимое (иконка и/или текстовая подпись) и роль — системное значение, которое может влиять на внешний вид.\n\nОбласть нажатия должна быть не меньше 44×44 pt. Для кастомной кнопки обязательно предусмотрите состояние нажатия — иначе она будет казаться неотзывчивой. Выделяйте акцентным цветом не больше одной-двух кнопок на экране, чтобы было ясно, какое действие главное.\n\nРоль бывает обычной, primary (наиболее вероятный выбор — акцентный цвет), destructive (разрушительное действие — системный красный) или cancel; не назначайте primary разрушительному действию. Пока действие выполняется, кнопка может ненадолго показать индикатор загрузки вместо текста.' },
    { type:'image', src:'assets/buttons-roles-alert.png', alt:'Кнопки в алерте: Primary Button — акцентная заполненная, Destructive Button — красный текст, Secondary Button — нейтральная серая', caption:'В алерте роль кнопки видна по стилю: primary выделена цветом, destructive — красным текстом, secondary — нейтральная' },

  ]},
  'context-menus': { blocks: [
    { type:'caption', text:'Из Figma-библиотеки iOS 27' },
    { type:'image', src:'assets/context-menus-figma.png', alt:'Анатомия контекстного меню: пункты с иконками, деструктивное действие красным, недоступный пункт затемнён, подменю со стрелкой', caption:'Context Menu' },
    { type:'caption', text:'Из документации Apple' },
    { type:'heading', text:'Рекомендации' },
    { type:'text', text:'Вызывается долгим нажатием (Haptic Touch) или Force Touch на поддерживающих устройствах.\n\nПеред меню можно показать превью содержимого — так проще выбрать нужное действие. Пункты оформляются как в обычном меню: важные — вверху, деструктивные — красным, недоступные — затемнены; поддерживаются подменю.\n\nИспользуйте для быстрого доступа к частым действиям с элементом, не уводя человека на отдельный экран, — например, «Копировать» или «Удалить» для файла в списке.' }

  'menus': { blocks: [

function renderInfoBlock(b, blockId){
  if(b.type === 'caption') return `<div class="info-caption">${b.text}</div>`;
  if(b.type === 'heading') return `<h3 class="info-subheading">${b.text}</h3>`;
  if(b.type === 'text') return `<p class="info-paragraph">${b.text}</p>`;
  if(b.type === 'image') return `<div class="info-image${b.size ? ' ' + b.size : ''}"><img src="${b.src}" alt="${b.alt}">${b.caption ? `<div class="info-image-cap">${b.caption}</div>` : ''}</div>`;
  if(b.type === 'picker'){
    const pid = blockId || ('picker-' + Math.random().toString(36).slice(2));
    const defaultIdx = Math.max(0, b.options.findIndex(o => o.label === 'Default'));
    const panels = b.options.map((o,i) => `<div class="picker-panel${i===defaultIdx?' active':''}"><div class="info-image"><img src="${o.image}" alt="${o.alt}"></div>${o.text ? `<p class="info-paragraph">${o.text}</p>` : ''}</div>`).join('');
    const items = b.options.map((o,i) => `<button class="wheel-item${i===defaultIdx?' center':''}" onclick="selectWheel('${pid}', ${i}, true)">${o.label}</button>`).join('');
    return `<div class="picker" id="${pid}" data-default-idx="${defaultIdx}"><div class="picker-panels">${panels}</div><div class="wheel-picker"><div class="wheel-track">${items}</div><div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div></div></div>`;
  }
  return '';
}

function selectWheel(pid, idx, shouldScroll){
  const el = document.getElementById(pid);
  if(!el) return;
  const track = el.querySelector('.wheel-track');
  const items = [...track.querySelectorAll('.wheel-item')];
  idx = Math.max(0, Math.min(items.length - 1, idx));
  if(shouldScroll){
    track.scrollTo({ top: idx * items[0].offsetHeight, behavior: 'smooth' });
  }
  items.forEach((it,i) => it.classList.toggle('center', i === idx));
  el.querySelectorAll('.picker-panel').forEach((p,i) => p.classList.toggle('active', i === idx));
}

function initWheelPicker(pid){
  const el = document.getElementById(pid);
  if(!el) return;
  const track = el.querySelector('.wheel-track');
  const items = [...track.querySelectorAll('.wheel-item')];
  if(!items.length) return;
  const itemH = items[0].offsetHeight || 34;
  let settleTimer = null;
  function updateFade(){
    const raw = track.scrollTop / itemH;
    items.forEach((it,i) => {
      const dist = Math.abs(i - raw);
      it.style.opacity = Math.max(0.3, 1 - dist * 0.4);
    });
  }
  function settle(){
    const raw = track.scrollTop / itemH;
    selectWheel(pid, Math.round(raw), false);
  }
  track.addEventListener('scroll', () => {
    updateFade();
    clearTimeout(settleTimer);
    settleTimer = setTimeout(settle, 120);
  });
  const startIdx = parseInt(el.getAttribute('data-default-idx'), 10) || 0;
  track.scrollTop = startIdx * itemH;
  updateFade();
}

function openInfo(componentId){
  const info = INFO_CONTENT[componentId];
  if(!info) return;
  const cat = getCategory(state.categoryId);
  const comp = cat.components.find(c => c.id === componentId);
  document.getElementById('infoTitle').textContent = comp ? comp.name : 'Примеры';
  document.getElementById('infoBody').innerHTML = info.blocks.map((b,i) => renderInfoBlock(b, `${componentId}-picker-${i}`)).join('');
  showScreen('screen-info');
  document.querySelectorAll('#infoBody .picker').forEach(p => initWheelPicker(p.id));
}

function studyStep(dir){
  const cat = getCategory(state.categoryId);
  if(dir === 1 && state.index === cat.components.length - 1){
    clearProgress();
    goCategory();
    return;
  }
  state.index = Math.min(Math.max(state.index + dir, 0), cat.components.length - 1);
  saveProgress();
  renderStudyCard();
}

function startQuiz(){
  state.categoryId = currentCategoryForModeScreen;
  state.mode = 'quiz';
  state.index = 0;
  const cat = DATA.find(c => c.id === state.categoryId);
  state.quizIds = shuffledIds(cat.components).slice(0, 10);
  state.quizResults = new Array(state.quizIds.length).fill(null);
  saveProgress();
  renderQuizCard();
  showScreen('screen-quiz');
}

function buildGlobalQuizPool(n){
  const all = [];
  DATA.filter(cat => (cat.group || 'components') === 'components').forEach(cat => cat.components.forEach(c => all.push(c.id)));
  for(let i = all.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, Math.min(n, all.length));
}

function startGlobalQuiz(){
  currentCategoryForModeScreen = '__global__';
  state.categoryId = '__global__';
  state.mode = 'quiz';
  state.index = 0;
  state.globalIds = buildGlobalQuizPool(10);
  state.quizResults = new Array(state.globalIds.length).fill(null);
  saveProgress();
  renderQuizCard();
  showScreen('screen-quiz');
}

function repeatQuiz(){
  if(currentCategoryForModeScreen === '__global__'){
    startGlobalQuiz();
  } else {
    startQuiz();
  }
}

function renderQuizCard(){

/* ---------- FUZZY MATCH (tolerate small typos in quiz answers) ---------- */
// Levenshtein distance with edit-operation backtrace between the typed
// answer (a) and the expected name (b).
function levenshteinOps(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for(let i = 0; i <= m; i++) dp[i][0] = i;
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      if(a[i-1] === b[j-1]){
        dp[i][j] = dp[i-1][j-1];
      } else {
        dp[i][j] = 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
      }
    }
  }
  const ops = [];
  let i = m, j = n;
  while(i > 0 || j > 0){
    if(i > 0 && j > 0 && a[i-1] === b[j-1] && dp[i][j] === dp[i-1][j-1]){
      i--; j--;
    } else if(i > 0 && j > 0 && dp[i][j] === dp[i-1][j-1] + 1){
      ops.push({ type: 'sub', pos: j-1, expected: b[j-1], typed: a[i-1] });
      i--; j--;
    } else if(j > 0 && dp[i][j] === dp[i][j-1] + 1){
      // letter exists in expected (b) but missing from the typed answer (a)
      ops.push({ type: 'missing', pos: j-1, letter: b[j-1] });
      j--;
    } else if(i > 0 && dp[i][j] === dp[i-1][j] + 1){
      // letter exists in the typed answer (a) but not in expected (b)
      ops.push({ type: 'extra', pos: j, letter: a[i-1] });
      i--;
    } else {
      break;
    }
  }
  ops.reverse();
  return { distance: dp[m][n], ops };
}

function positionPhrase(pos, len){
  if(len <= 1) return '';
  if(pos <= 0) return 'в начале';
  if(pos >= len - 1) return 'на конце';
  return 'в середине';
}

// Returns a friendly Russian message describing the typo if the typed
// answer is close enough (1-2 character edits) to the expected name,
// or null if it's an exact match or too different to count.
function typoFeedback(answer, expected, originalName){
  if(answer === expected) return null;
  const { distance, ops } = levenshteinOps(answer, expected);
  if(distance === 0 || distance > 2) return null;

  if(ops.length === 1){
    const op = ops[0];
    const posPhrase = positionPhrase(op.pos, expected.length);
    if(op.type === 'missing'){
      return `не хватает «${op.letter}» ${posPhrase} слова ${originalName}, но в целом вариант верный!`;
    }
    if(op.type === 'extra'){
      return `лишняя буква «${op.letter}» ${posPhrase} — в остальном верно, это ${originalName}!`;
    }
    if(op.type === 'sub'){
      return `небольшая опечатка: «${op.typed}» вместо «${op.expected}» ${posPhrase} — но в целом верно, это ${originalName}!`;
    }
  }
  return `пара небольших опечаток, но в целом вариант верный — это ${originalName}!`;
}

function quizCheck(){
  const cat = getCategory(state.categoryId);
  const comp = cat.components[state.index];
  const input = document.getElementById('quizInput');
  const checkBtn = document.getElementById('quizCheck');
  const skipBtn = document.getElementById('quizSkip');

  // if already answered (correct or not), this button advances instead
  if(input.disabled){
    quizAdvance();
    return;
  }

  const answer = normalize(input.value);
  const expected = normalize(comp.name);
  let isCorrect = answer.length > 0 && answer === expected;
  let typoMessage = null;

  if(!isCorrect && answer.length > 0){
    typoMessage = typoFeedback(answer, expected, comp.name);
    if(typoMessage) isCorrect = true;
  }

  // answer is locked in either way — no retrying after seeing the result
  input.disabled = true;
  skipBtn.disabled = true;
  checkBtn.textContent = state.index === cat.components.length - 1 ? 'Результат' : 'Далее';

  if(isCorrect){
    input.classList.remove('incorrect');
    input.classList.add('correct');
    state.quizResults[state.index] = true;
    document.getElementById('quizHint').textContent = typoMessage || 'Верно!';
    document.getElementById('quizHint').className = typoMessage ? 'quiz-hint typo' : 'quiz-hint';
  } else {
    input.classList.remove('correct');
    input.classList.add('incorrect');
    document.getElementById('quizHint').textContent = `Не совсем. Правильный ответ: ${comp.name}`;
    document.getElementById('quizHint').className = 'quiz-hint reveal';
    state.quizResults[state.index] = false;
  }
  saveProgress();
}

function quizAdvance(){
  const cat = getCategory(state.categoryId);
  if(state.index === cat.components.length - 1){
    showResult();
    return;
  }
  state.index++;
  saveProgress();
  renderQuizCard();
}

function quizSkip(){
  const cat = getCategory(state.categoryId);
  if(state.quizResults[state.index] === null) state.quizResults[state.index] = false;
  if(state.index === cat.components.length - 1){
    showResult();
    return;
  }
  state.index++;
  saveProgress();
  renderQuizCard();
}

document.getElementById('quizInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); quizCheck(); }
});

function showResult(){
  const cat = getCategory(state.categoryId);
  const correct = state.quizResults.filter(r => r === true).length;
  document.getElementById('resultScore').textContent = `${correct} / ${cat.components.length}`;
  document.getElementById('resultTotal').textContent = cat.components.length;
  document.getElementById('resultCat').textContent = cat.title;
  clearProgress();
  showScreen('screen-result');
}

/* ---------- INIT ---------- */
renderHome();
</script>
